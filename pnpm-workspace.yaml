# pnpm workspace members.
#
# The product is mid-conversion (Sprint 9). These are the application:
#
#   apps/api                Nest.js host            | the TypeScript stack the
#   apps/web                Next.js client          | conversion is building.
#   packages/domain         entities, invariants    | Layer rules are enforced by
#   packages/application    use cases, authz        | biome.json overrides and
#   packages/infrastructure Prisma, integrations    | asserted by tools/boundaries.
#   packages/design-system  comp P primitives       |
#
#   src/Collega.*           FROZEN. The .NET application being replaced - not a workspace
#                           member, not maintained, and its instructions no longer apply
#                           (SPEC/decisions.md 2026-09-06). Kept runnable only so a golden
#                           fixture can still be re-recorded; deleted in slice F6.
#
#   e2e                     Playwright suite; harness repointed at apps/web, flows are F2's
#   tools/golden            capture and replay harness - the conversion's only oracle
#   tools/boundaries        architecture test over the layer-boundary lint
#   tools/arch              architecture tests lint cannot express
#   SPEC/mockups/_build/tw  Tailwind CLI that compiles CSS inlined into the comps
#
# apps/* and packages/* are globbed so a new workspace member is picked up without
# editing this file.
packages:
  - 'e2e'
  - 'tools/golden'
  - 'tools/boundaries'
  - 'tools/arch'
  - 'SPEC/mockups/_build/tw'
  - 'apps/*'
  - 'packages/*'

# pnpm 12 refuses to run a dependency's install scripts unless it is named here, and
# every one of these fetches a native binary its tool cannot run without.
# oxide and parcel/watcher are Tailwind's, pulled in by @tailwindcss/cli in
# SPEC/mockups/_build/tw: oxide is the Rust engine, parcel/watcher backs --watch.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  # Vitest's bundler. Its postinstall fetches the platform-native binary; without it
  # every package's `test` script fails before running a single test.
  esbuild: true
  # Prisma's postinstall downloads the query and schema engines and generates the client.
  # Without it every database call fails at import time, not at query time.
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true

# Transitive versions we pin past what the dependency that pulls them in asks for.
#
# HERE, NOT IN package.json: pnpm 12 no longer reads `pnpm.overrides` from package.json and
# ignores it with a warning, so an override written there looks applied and does nothing.
#
# multer is @nestjs/platform-express's, reaching us through `FileInterceptor` on the two CSV
# import endpoints. 2.2.0 carries four high DoS advisories, all remotely triggerable by an
# uploader (crafted multipart field names, a file-descriptor leak on an aborted upload, an
# oversized array index) plus a file-size-limit bypass; 2.3.0 fixes them and platform-express
# has not moved its own pin. Drop this once it does.
overrides:
  multer: ^2.3.0

# pnpm 12 holds back very recently published versions by default as a supply-chain
# measure. Playwright 1.63.0 is pinned deliberately, so it is excluded from that hold.
minimumReleaseAgeExclude:
  - '@playwright/test@1.63.0'
  - playwright-core@1.63.0
  - playwright@1.63.0
