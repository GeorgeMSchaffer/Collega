name: Deploy API

# Builds and deploys Collega.API to Azure App Service on every push to main.
# Setup (two values) is in SPEC/50-azure-api-cicd.md.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Container-backed tests are excluded from the deploy gate on purpose. `ubuntu-latest` has a
      # Docker daemon, so without this filter the Testcontainers PostgreSQL tests run here and every
      # production deploy would depend on pulling postgres:16 and Ryuk from Docker Hub — a registry
      # outage or rate limit would block shipping. They exist to verify the PostgreSQL migration
      # (real SQL translation, collation, DDL — none of which the InMemory suite can prove), not to
      # gate each deploy. Run them locally with `dotnet test Collega.sln`, which includes them.
      - name: Test
        run: dotnet test Collega.sln -c Release --filter "Category!=Container"

      - name: Publish
        run: dotnet publish src/Collega.API/Collega.API.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
