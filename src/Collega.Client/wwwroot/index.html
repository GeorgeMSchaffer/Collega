<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collega</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Collega.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Triggers a client-side file download from base64 bytes (used for authenticated CSV exports,
        // which can't be a plain <a href> because the request needs the bearer token).
        window.collegaDownloadFile = (fileName, contentType, base64) => {
            const link = document.createElement('a');
            link.href = `data:${contentType};base64,${base64}`;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
        };
    </script>
</body>

</html>
