<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collega</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Collega.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Triggers a client-side file download from base64 bytes (used for authenticated CSV exports,
        // which can't be a plain <a href> because the request needs the bearer token).
        window.collegaDownloadFile = (fileName, contentType, base64) => {
            const link = document.createElement('a');
            link.href = `data:${contentType};base64,${base64}`;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
        };

        // Resizes an image (given as a data URI) to at most maxHeight px tall via a canvas and returns
        // { dataUri, height } as a PNG. Used for organization logo uploads so the server stores a small
        // thumbnail without needing a server-side image library.
        window.collegaResizeImage = (dataUri, maxHeight) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, maxHeight / img.height);
                const w = Math.max(1, Math.round(img.width * scale));
                const h = Math.max(1, Math.round(img.height * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve({ dataUri: canvas.toDataURL('image/png'), height: h });
            };
            img.onerror = () => reject('That file could not be read as an image.');
            img.src = dataUri;
        });
    </script>

    <script>
        // A native <button> does not scroll the page when Space activates it; an element with
        // role="button" does, because Space keeps its default scroll behaviour there. Board cards
        // and list rows are role="button" and handle Space to open the idea drawer, so without
        // this the page scrolls behind the drawer it just opened.
        //
        // It lives here rather than on the component because Blazor's @onkeydown:preventDefault
        // is static — it cannot be applied to Space alone, and applying it to every key would
        // break Tab out of the card. The rule is the same for any role="button" anyway.
        document.addEventListener('keydown', (event) => {
            if (event.key !== ' ' || event.defaultPrevented) {
                return;
            }

            if (event.target instanceof Element && event.target.getAttribute('role') === 'button') {
                event.preventDefault();
            }
        });
    </script>
</body>

</html>
