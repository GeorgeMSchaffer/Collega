  <text x="94" y="940" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e3a8a">Interaction rule: clicking the card title opens an in-context detail overlay for full edits (description, tags, mentions, due date, assignment, comments).</text>
