<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1024" viewBox="0 0 1760 1024" role="img" aria-labelledby="title desc">
  <title id="title">SargentNexus board empty state final direction</title>
  <desc id="desc">Final board empty-state design in a hybrid Jira and Trello card-first style with explicit swimlane columns and guided setup actions.</desc>

  <rect width="1760" height="1024" fill="#e9edf4"/>
  <rect x="20" y="20" width="1720" height="984" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="44" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Final Direction - Card-First Empty Board (B)</text>

  <g>
    <rect x="40" y="82" width="1680" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">Default Board</text>
    <rect x="1574" y="94" width="128" height="32" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1638" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Import CSV</text>

    <rect x="40" y="148" width="1680" height="826" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="60" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Start with a template card</text>
    <text x="60" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">A Trello-like starter path with Jira-like board controls.</text>

    <rect x="60" y="278" width="320" height="548" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="396" y="278" width="320" height="548" rx="10" fill="#f7f7fb" stroke="#ddd6fe"/>
    <rect x="732" y="278" width="320" height="548" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <rect x="1068" y="278" width="320" height="548" rx="10" fill="#f7f7fb" stroke="#ddd6fe"/>
    <rect x="1404" y="278" width="296" height="548" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>

    <text x="220" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">New / Pending</text>
    <text x="556" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">In Review</text>
    <text x="892" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">In Progress</text>
    <text x="1228" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">Client Review</text>
    <text x="1552" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#334155">Complete</text>

    <rect x="84" y="330" width="272" height="152" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="102" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Example starter</text>
    <text x="102" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Title + summary</text>
    <text x="102" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Tag + owner</text>
    <text x="102" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">Move to progress</text>

    <rect x="396" y="330" width="320" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="556" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Drop cards here</text>

    <rect x="732" y="330" width="320" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="892" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Drop cards here</text>

    <rect x="1068" y="330" width="320" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1228" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Drop cards here</text>

    <rect x="1404" y="330" width="296" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="1552" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Drop cards here</text>

    <rect x="60" y="842" width="1640" height="114" rx="10" fill="#fff7ed" stroke="#fdba74"/>
    <text x="78" y="870" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#9a3412">Usability and policy cues</text>
    <text x="78" y="890" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">Read Only users can comment and upvote once ideas exist.</text>
    <text x="78" y="908" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">Default lane placement applies when status is omitted on create.</text>
    <text x="78" y="926" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">Role-based action availability should be shown before failure.</text>
  </g>
