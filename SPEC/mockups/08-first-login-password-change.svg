<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Collega first-login password change mockup</title>
  <desc id="desc">A Guided Setup style first-login password change experience for the seeded Site Admin account.</desc>
  <rect width="1500" height="980" fill="#ecf3ff"/>
  <rect x="0" y="0" width="1500" height="84" fill="#ffffff"/>
  <text x="36" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Collega</text>
  <text x="36" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">First login security setup - Guided Setup direction</text>

  <rect x="186" y="140" width="1128" height="760" rx="24" fill="#ffffff" stroke="#d0d7de"/>
  <text x="236" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Change initial credential</text>
  <text x="236" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Your seeded Site Admin password must be changed before continuing to protected features.</text>

  <rect x="236" y="272" width="1028" height="82" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="262" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Why this step is required</text>
  <text x="262" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e3a8a">This account was created from an environment-provided initial credential. Set a private password now.</text>

  <text x="236" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Current password</text>
  <rect x="236" y="418" width="492" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="254" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#111827">.............</text>

  <text x="236" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">New password</text>
  <rect x="236" y="520" width="492" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="254" y="552" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#111827">.............</text>

  <text x="236" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Confirm new password</text>
  <rect x="236" y="622" width="492" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="254" y="654" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="2" fill="#111827">.............</text>

  <rect x="766" y="384" width="498" height="332" rx="16" fill="#f8fafc" stroke="#d0d7de"/>
  <text x="798" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Complexity checklist</text>
  <rect x="798" y="446" width="434" height="2" fill="#e2e8f0"/>
  <text x="798" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">- Minimum length requirement met</text>
  <text x="798" y="512" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">- Includes uppercase and lowercase letters</text>
  <text x="798" y="542" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">- Includes at least one number</text>
  <text x="798" y="572" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a">- Includes at least one special character</text>

  <rect x="798" y="604" width="434" height="84" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="818" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Validation behavior</text>
  <text x="818" y="660" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412">On submit, unmet rules are shown inline and in summary.</text>

  <rect x="236" y="732" width="1028" height="82" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="262" y="764" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">After successful change</text>
  <text x="262" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Redirect to admin dashboard and record audit events for password change.</text>

  <rect x="1050" y="838" width="214" height="44" rx="8" fill="#0f6cbd"/>
  <text x="1157" y="866" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Save and continue</text>
</svg>
