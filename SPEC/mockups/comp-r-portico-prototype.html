<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Comp R: the interactive reference for the list and detail pattern, the themes and idea assistant v2 (2026-09-27). Self-contained; open in a browser. Seeded Acme Robotics data is inlined. -->
<title>Collega Portico Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=Lexend:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Schibsted+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap">
<style>
/* A product prototype: each theme is one complete product palette, chosen from the prototype bar.
   Every colour the app uses is a token below, so a theme is only a block of values. */
:root,:root[data-proto-theme="portico"]{--suggest:#3B6E51;--suggest-tint:#E3EEE7;color-scheme:light;
--bg:#F1F5F5;--ink:#16292E;--ink2:#2C4247;--muted:#56696D;--line:#DDE6E7;--line2:#C6D3D5;--card:#FFFFFF;--soft:#E8EFF0;--rowh:#F6FAFA;--thead:#F7FAFA;--facts:#F6FAFA;
--pri:#1F6A80;--pri-h:#185769;--pri-t:#1B5F73;--pri-tint:#E1EEF1;--pri-ink:#FFFFFF;--vote:#F2B28A;--vote-ink:#16292E;
--hot:#B64A34;--hot-t:#963B28;--hot-tint:#F6E1DB;--ok-t:#3B6E51;--ok-tint:#E3EEE7;--warn-t:#8E4A1F;--warn-tint:#FCEBDF;
--side:#FFFFFF;--side-ink:#2C4247;--side-line:#DDE6E7;--side-hover:#EEF4F4;--side-on:#E1EEF1;--side-on-ink:#16292E;--bar:#16292E;--bar-ink:#E3EEF0;
--tag:#E1EEF1;--tag-ink:#1B5566;--av1:#1F6A80;--av1i:#FFFFFF;--av2:#F2B28A;--av2i:#16292E;--av3:#7A5AA6;--av3i:#FFFFFF;--av4:#4F8A6A;--av4i:#FFFFFF;
--shadow:22 41 46;--r:14px;--rs:10px;--display:"Outfit",ui-sans-serif,system-ui,sans-serif;--body:"Figtree",ui-sans-serif,system-ui,sans-serif;--mono:"DM Mono",ui-monospace,monospace;--h-weight:600}
:root[data-proto-theme="sera"]{--suggest:#2E6E4C;--suggest-tint:#E1EFE7;--bg:#F3F4F7;--ink:#1C2236;--ink2:#343B52;--muted:#5C6378;--line:#E2E4EC;--line2:#CCD0DC;--soft:#ECEEF3;--rowh:#F7F8FB;--thead:#F7F8FB;--facts:#F5F6FA;
--pri:#3450A8;--pri-h:#2A4290;--pri-t:#2E4799;--pri-tint:#E6EAF6;--vote:#E3B04B;--vote-ink:#1C2236;--hot:#B8553F;--hot-t:#94402D;--hot-tint:#F6E3DE;--ok-t:#2E6E4C;--ok-tint:#E1EFE7;--warn-t:#83590C;--warn-tint:#FAF0DA;
--side:#1F2540;--side-ink:#CDD1E3;--side-line:#2D3454;--side-hover:#272E4D;--side-on:#2E3760;--side-on-ink:#FFFFFF;--bar:#0F1426;--bar-ink:#E6E9F5;--tag:#ECEEF3;--tag-ink:#343B52;
--av1:#3450A8;--av1i:#FFFFFF;--av2:#E3B04B;--av2i:#1C2236;--av3:#B8553F;--av3i:#FFFFFF;--av4:#3E8A62;--av4i:#FFFFFF;--shadow:28 34 54;--r:16px;--display:"Bricolage Grotesque",ui-sans-serif,sans-serif;--body:"DM Sans",ui-sans-serif,system-ui,sans-serif;--h-weight:700}
:root[data-proto-theme="lagoon"]{--suggest:#2F5F9E;--suggest-tint:#E3ECF8;--bg:#F3F4EF;--ink:#13302B;--ink2:#2A4640;--muted:#5A6B66;--line:#E1E5DF;--line2:#CBD3CB;--soft:#EAEFEA;--rowh:#F7F9F5;--thead:#F7F9F5;--facts:#F5F8F3;
--pri:#0E6B5C;--pri-h:#0A5649;--pri-t:#0C6154;--pri-tint:#DCEFEA;--vote:#F08A6C;--vote-ink:#13302B;--hot:#C2412D;--hot-t:#9E3322;--hot-tint:#F9E1DA;--ok-t:#2F6B3F;--ok-tint:#E2F0E4;--warn-t:#7A5410;--warn-tint:#F8EDD3;
--side:#FFFFFF;--side-ink:#2A4640;--side-line:#E1E5DF;--side-hover:#EFF3EE;--side-on:#DCEFEA;--side-on-ink:#13302B;--bar:#0F2A25;--bar-ink:#E2F0EC;--tag:#DCEFEA;--tag-ink:#0C5549;
--av1:#0E6B5C;--av1i:#FFFFFF;--av2:#F08A6C;--av2i:#13302B;--av3:#3D6FB6;--av3i:#FFFFFF;--av4:#8C6A1F;--av4i:#FFFFFF;--shadow:19 48 43;--r:16px;--rs:12px;--display:"Lexend",ui-sans-serif,sans-serif;--body:"Nunito Sans",ui-sans-serif,system-ui,sans-serif;--h-weight:600}
:root[data-proto-theme="terrazzo"]{--suggest:#3F6B2E;--suggest-tint:#E6F2DF;--bg:#F5F6F8;--ink:#1E2733;--ink2:#36414F;--muted:#5E6978;--line:#E3E6EB;--line2:#CDD2DA;--soft:#EDF0F3;--rowh:#F8F9FB;--thead:#F8F9FB;--facts:#F6F7F9;
--pri:#3D5A80;--pri-h:#324B6B;--pri-t:#35507A;--pri-tint:#E4EAF2;--vote:#F4C7C3;--vote-ink:#1E2733;--hot:#B84A4A;--hot-t:#963636;--hot-tint:#F7E2E2;--ok-t:#3F6B2E;--ok-tint:#E6F2DF;--warn-t:#7F5A12;--warn-tint:#F7EDD6;
--side:#FFFFFF;--side-ink:#36414F;--side-line:#E3E6EB;--side-hover:#F1F3F6;--side-on:#E4EAF2;--side-on-ink:#1E2733;--bar:#1E2733;--bar-ink:#E8ECF2;--tag:#F4E4E1;--tag-ink:#7A3B34;
--av1:#3D5A80;--av1i:#FFFFFF;--av2:#F4C7C3;--av2i:#1E2733;--av3:#4E7A40;--av3i:#FFFFFF;--av4:#7A5AA6;--av4i:#FFFFFF;--shadow:30 39 51;--r:8px;--rs:6px;--display:"Schibsted Grotesk",ui-sans-serif,sans-serif;--body:"Public Sans",ui-sans-serif,system-ui,sans-serif;--h-weight:700}
:root[data-proto-theme="notte"]{--suggest:#86C9A0;--suggest-tint:#183228;color-scheme:dark;--bg:#0F1A1D;--ink:#E4EEF0;--ink2:#C4D3D6;--muted:#93A7AB;--line:#22343A;--line2:#2E454C;--card:#152327;--soft:#1B2C31;--rowh:#1A2A2F;--thead:#172529;--facts:#1A2A2F;
--pri:#4FB0C9;--pri-h:#6CC2D8;--pri-t:#7CCCE0;--pri-tint:#173A44;--pri-ink:#0B1417;--vote:#F2B28A;--vote-ink:#0F1A1D;--hot:#E07A63;--hot-t:#F09A85;--hot-tint:#3A211C;--ok-t:#86C9A0;--ok-tint:#183228;--warn-t:#F2B97F;--warn-tint:#37291A;
--side:#111E22;--side-ink:#C4D3D6;--side-line:#22343A;--side-hover:#18282D;--side-on:#173A44;--side-on-ink:#E4EEF0;--bar:#070D0F;--bar-ink:#C4D3D6;--tag:#173A44;--tag-ink:#9FD6E4;
--av1:#4FB0C9;--av1i:#0B1417;--av2:#F2B28A;--av2i:#0F1A1D;--av3:#A68BD1;--av3i:#0F1A1D;--av4:#7DC39C;--av4i:#0F1A1D;--shadow:0 0 0}
:root{--drawer:clamp(380px,28vw,520px);--drawer-wide:clamp(720px,62vw,1100px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);color:var(--ink)}
a{color:var(--pri-t)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.i{width:16px;height:16px;flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* prototype controls, outside the app */
.proto{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--bar);color:var(--bar-ink);font-size:13px;flex:none}
.proto b{font-family:var(--display);font-weight:600}
.proto .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.proto .lbl{opacity:.7;margin-right:2px}
.proto button{background:transparent;border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);border-radius:999px;padding:3px 10px;color:var(--bar-ink);cursor:pointer}
.proto button[aria-pressed="true"]{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink)}
.proto select{background:var(--bar);color:var(--bar-ink);border:1px solid color-mix(in srgb,var(--bar-ink) 30%,transparent);border-radius:999px;padding:3px 8px}

/* app shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);flex:1 0 auto}
.side{background:var(--side);border-right:1px solid var(--side-line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;color:var(--side-ink)}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 12px}
.brand b{display:block;font:600 16px/1.1 var(--display)}.brand small{font-size:12px;opacity:.75}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:var(--rs);background:var(--pri);color:var(--pri-ink);font:600 12px var(--display)}
.navlbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;padding:10px 8px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--rs);color:var(--side-ink);cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--side-hover)}
.nav:disabled{opacity:.55;cursor:default}
.nav[aria-current="page"]{background:var(--side-on);color:var(--side-on-ink);font-weight:600}
.nav span{flex:1}.nav small{font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 6px 2px;border-top:1px solid var(--side-line)}
.me b{display:block;font-size:13px}.me small{font-size:12px;opacity:.75}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;min-height:52px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.topbar .sp{flex:1}
.themepick{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.themepick select{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;background:var(--card);color:var(--ink);cursor:pointer}
.crumb{color:var(--muted)}.crumb b{color:var(--ink)}.crumb button{border:0;background:none;padding:0;color:var(--pri-t);cursor:pointer}
.work{padding:20px 24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* page header: H1 + description left, the one "Add New" action right, vertically centred on the block */
.pghead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pghead h1{margin:0;font:var(--h-weight) 28px/1.15 var(--display);letter-spacing:-.02em}
.pghead p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.denywrap{display:inline-flex;align-items:center;gap:8px}
.why{font-size:12px;color:var(--muted);font-style:italic}

.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:8px 14px;border-radius:var(--rs);border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}.btn.pri:hover{background:var(--pri-h)}
.btn.danger{background:var(--hot);border-color:var(--hot);color:#fff}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.linkbtn{border:0;background:none;padding:0;color:var(--pri-t);cursor:pointer;font-weight:600;font-size:13px}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn.del:hover{background:var(--hot-tint);color:var(--hot-t)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);padding:0 10px;min-width:min(100%,280px);flex:0 1 320px}
.search input{border:0;outline:0;padding:8px 0;width:100%;background:transparent}
.search:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-tint)}
.ms{position:relative}
.msbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.msbtn[data-active="true"]{border-color:var(--pri);background:var(--pri-tint);color:var(--pri-t);font-weight:600}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:240px;background:var(--card);border:1px solid var(--line2);border-radius:var(--rs);box-shadow:0 12px 32px rgb(var(--shadow)/.18);padding:8px}
.pop input[type=search]{width:100%;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;margin-bottom:6px}
.pop label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--soft)}
.pop .clear{border:0;background:none;color:var(--pri-t);cursor:pointer;padding:4px 6px;font-size:12px}
.tb-sp{flex:1}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--rs);padding:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(var(--shadow)/.12)}

/* table */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--rowh)}
th{font:600 12px var(--body);color:var(--muted);background:var(--thead);white-space:nowrap}
th button{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
th[aria-sort] button{color:var(--ink)}
th .arrow{width:12px;height:12px;opacity:.35}
th[aria-sort] .arrow{opacity:1}
td.num{font-variant-numeric:tabular-nums}
td.actions,th.actions{text-align:right;white-space:nowrap;width:1%}
.ttl{font-weight:600;color:var(--ink);cursor:pointer;border:0;background:none;padding:0;text-align:left}
.ttl:hover{color:var(--pri-t);text-decoration:underline}
.sub{display:block;font-size:12px;color:var(--muted);max-width:52ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.prio-Low{background:var(--soft);color:var(--muted)}.prio-Medium{background:var(--pri-tint);color:var(--pri-t)}
.prio-High{background:var(--warn-tint);color:var(--warn-t)}.prio-Critical{background:var(--hot-tint);color:var(--hot-t)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--tag);color:var(--tag-ink);margin:1px 2px 1px 0;white-space:nowrap}
.avs{display:inline-flex}.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font:700 10px var(--body);border:2px solid var(--card);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.av-OA{background:var(--av1);color:var(--av1i)}.av-NC{background:var(--av2);color:var(--av2i)}.av-MC{background:var(--av3);color:var(--av3i)}.av-RO{background:var(--av4);color:var(--av4i)}
.votes{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-size:12px}
.votes.has{background:var(--vote);color:var(--vote-ink);border-radius:999px;padding:0 8px 0 5px}
.state-arch{background:var(--soft);color:var(--muted)}.state-act{background:var(--ok-tint);color:var(--ok-t)}

/* pagination */
.pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.pager select{border:1px solid var(--line2);border-radius:8px;padding:4px 6px}
.pager .pages{display:flex;gap:4px}
.pager .pages button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--card);cursor:pointer}
.pager .pages button[aria-current="page"]{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
.pager .pages button:disabled{opacity:.4;cursor:default}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.lstrip{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden;background:var(--soft)}

/* lanes */
/* Swimlanes: each lane is a quiet full-height column, so the board reads as lanes, not loose cards. */
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.lane{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:min(62vh,560px);padding:6px 6px 12px;border-radius:14px;background:color-mix(in srgb,var(--soft) 55%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.lanehd{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px 12px 4px 4px;font-weight:600;font-size:13px}
.lanehd span{flex:1}.lanehd small{font:500 12px var(--mono);opacity:.8}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;width:100%}
.kcard:hover{border-color:var(--pri)}
.kcard[aria-current="true"]{outline:2px solid var(--pri);outline-offset:-1px}
.kcard h4{margin:0;font-size:13px;font-weight:600;line-height:1.35}
.krow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12px}

/* drawer: overlays the right of the page, never resizes it, so the board never gains a scrollbar */
.drawer{position:fixed;top:0;right:0;bottom:0;width:var(--drawer);background:var(--card);border-left:1px solid var(--line2);box-shadow:-18px 0 40px rgb(var(--shadow)/.16);z-index:40;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease,width .22s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer.wide{width:var(--drawer-wide)}
.dhead{display:flex;align-items:flex-start;gap:8px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dhead .eb{font:500 11px var(--mono);color:var(--muted);letter-spacing:.03em}
.dhead h2{margin:2px 0 0;font:var(--h-weight) 19px/1.25 var(--display);text-wrap:balance}
.dhead .x{margin-left:auto}
.dbody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-height:0}
.dfoot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--thead)}
.dfoot .sp{flex:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--facts);border-radius:var(--rs);padding:12px;margin:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.facts dd{margin:3px 0 0;font-weight:500;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sect h3{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sect p,.sect ul{margin:0}.sect ul{padding-left:18px}
.samp{font-size:11px;color:var(--muted);font-style:italic}
.field{display:flex;flex-direction:column;gap:4px;position:relative}
.field>label,.field .flabel{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.field input:not([type=checkbox]),.field select,.field textarea{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
.field small{color:var(--muted);font-size:12px}
.field .req{color:var(--hot-t)}
.field .err{color:var(--hot-t);font-size:12px;font-weight:600}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--hot)}
.fgroup{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
.fgroup>h3{margin:0;font:600 13px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sol{display:flex;gap:6px;align-items:center}
.people{display:flex;flex-wrap:wrap;gap:6px}
.people label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;font-size:12px}
.people input{accent-color:var(--pri)}
/* ✦ Suggested: filled by the assistant and not yet touched by the person */
.sugg{display:none;font:600 11px var(--body);color:var(--suggest);background:var(--suggest-tint);border-radius:999px;padding:0 8px}
.field.suggested .sugg{display:inline-block}
.field.suggested input:not([type=checkbox]),.field.suggested textarea,.field.suggested select{border-color:var(--suggest);background:color-mix(in srgb,var(--suggest-tint) 60%,var(--card))}
.field.flash input,.field.flash textarea,.field.flash select{animation:fill .9s ease}
@keyframes fill{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--suggest) 35%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.notice{display:flex;gap:8px;align-items:flex-start;background:var(--warn-tint);color:var(--warn-t);border-radius:var(--rs);padding:10px 12px;font-size:13px;font-weight:500}

/* assistant, left of the form in the wide create drawer */
.split{flex:1;display:grid;grid-template-columns:42% 58%;min-height:0}
/* one column when the chat is hidden: the form must not land in a zero-width first track */
.split.formonly{grid-template-columns:1fr;grid-template-rows:1fr}
.split.formonly .chat{display:none}
.chat{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--thead)}
.chathd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.chathd .sp{flex:1}
.spark{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--pri-ink);font-size:13px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:14px;line-height:1.45}
.msg.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--pri);color:var(--pri-ink);border-top-right-radius:4px;align-self:flex-end}
.msg.me.dropped{opacity:.45;text-decoration:line-through;transition:opacity .6s}
.msg .filled{display:block;margin-top:6px;font-size:12px;color:var(--suggest);font-weight:600}
.msg.sys{align-self:center;font-size:12px;color:var(--muted);background:none;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--pri);color:var(--pri-t);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;text-align:left}
.chips button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.chips button:disabled{opacity:.5;cursor:default}
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.compose{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.compose form{display:flex;gap:6px}
.compose textarea{flex:1;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;resize:none;min-height:40px}
.compose .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.formpane{display:flex;flex-direction:column;min-height:0}

/* confirm dialog: the one modal, for destructive actions only */
.scrim{position:fixed;inset:0;background:rgb(var(--shadow)/.4);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--card);border-radius:var(--r);max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgb(var(--shadow)/.3)}
.dialog h2{margin:0;font:var(--h-weight) 18px var(--display)}.dialog p{margin:0;color:var(--ink2)}
.dialog .row{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;z-index:70;font-size:13px}

@media (max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.lanes{grid-template-columns:repeat(5,minmax(200px,1fr));overflow-x:auto}:root{--drawer:100vw;--drawer-wide:100vw}.split{grid-template-columns:1fr;grid-template-rows:minmax(240px,45%) 1fr}.chat{border-right:0;border-bottom:1px solid var(--line)}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.field.flash input,.field.flash textarea,.field.flash select{animation:none}.thinking i{animation:none}}

// Two-way binding between a draft object and the form. `sugg` holds keys the assistant filled;
// `owned` holds keys the person has edited, which the assistant never overwrites.
function wireIdeaForm(draft) {
  const D = { title: draft?.short ?? '', problem: draft?.problem ?? '', solutions: [...(draft?.solutions ?? [])], rationale: draft?.rationale ?? '', impact: draft?.impact ?? '',
    priority: draft?.priority ?? 'Medium', type: draft?.type ?? '', status: draft?.status ?? 'New / Pending', due: draft?.due ?? '', assignees: [...(draft?.assignees ?? [])],
    tags: [...(draft?.tags ?? [])], description: draft?.description ?? '', custom: { ...(draft?.custom ?? {}) }, board: draft?.board ?? (S.screen === 'board' ? S.board : boards[0].name),
    sugg: new Set(), owned: new Set() };
  const el = (id) => drawer.querySelector('#f-' + id);
  const setVal = (key) => { const e = el(key); if (!e) return; if (key === 'tags') e.value = D.tags.join(', '); else if (key !== 'solutions' && key !== 'assignees') e.value = D[key] ?? ''; };
  const drawSolutions = () => {
    el('solutions').innerHTML = (D.solutions.length ? D.solutions : ['']).map((s, n) => `<div class="sol"><input aria-label="Solution ${n + 1}" data-sol="${n}" value="${esc(s)}"><button type="button" class="iconbtn" data-sol-del="${n}" aria-label="Remove solution ${n + 1}">${svg('x')}</button></div>`).join('');
  };
  const drawCustom = () => {
    const defs = CUSTOM[D.type] ?? [];
    el('custom').innerHTML = defs.length ? `<h3>${esc(D.type)} fields</h3>` + defs.map((c) => {
      const id = 'c-' + c.key, v = D.custom[c.key];
      const input = c.type === 'select' ? `<select id="${id}"><option value="">Choose…</option>${c.options.map((o) => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`
        : c.type === 'bool' ? `<label style="font-weight:500"><input type="checkbox" id="${id}"${v ? ' checked' : ''}> Yes</label>`
        : `<input id="${id}" type="${c.type === 'number' ? 'number' : 'text'}" value="${esc(v ?? '')}">`;
      return `<div class="field${D.sugg.has('custom.' + c.key) ? ' suggested' : ''}" data-f="custom.${c.key}"><label for="${id}">${esc(c.label)}${c.required ? ' <span class="req" aria-hidden="true">*</span>' : ''}<span class="sugg">✦ Suggested</span></label>${input}<span class="err" hidden></span></div>`;
    }).join('') + '<span class="samp">Illustrative custom fields, attached through the Idea Type.</span>' : '<span class="samp">Pick an Idea Type to see its custom fields.</span>';
  };
  ['title', 'problem', 'rationale', 'impact', 'priority', 'type', 'status', 'due', 'tags', 'description'].forEach(setVal);
  drawer.querySelectorAll('#f-assignees input').forEach((c) => (c.checked = D.assignees.includes(c.value)));

  const own = (key) => { D.owned.add(key); D.sugg.delete(key); drawer.querySelector(`[data-f="${key}"]`)?.classList.remove('suggested'); };

    const t = e.target;

    if (t.id?.startsWith('c-')) { const k = t.id.slice(2); D.custom[k] = t.type === 'checkbox' ? t.checked : t.value; own('custom.' + k); return; }
    if (t.closest('#f-assignees')) { D.assignees = [...drawer.querySelectorAll('#f-assignees input:checked')].map((c) => c.value); own('assignees'); return; }
    const key = t.id?.slice(2); if (!key) return;
    D[key] = key === 'tags' ? t.value.split(',').map((x) => x.trim()).filter(Boolean).slice(0, 10) : t.value; own(key);
    if (key === 'type') drawCustom();
  });
  drawer.querySelector('#dform').addEventListener('change', (e) => { if (e.target.id?.startsWith('c-') || e.target.closest('#f-assignees') || e.target.tagName === 'SELECT') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
  drawer.querySelector('#dform').addEventListener('click', (e) => {
    if (e.target.closest('[data-sol-add]')) { D.solutions.push(''); own('solutions'); drawSolutions(); drawer.querySelector(`[data-sol="${D.solutions.length - 1}"]`).focus(); }
    const del = e.target.closest('[data-sol-del]'); if (del) { D.solutions.splice(+del.dataset.solDel, 1); own('solutions'); drawSolutions(); }

// ---------- the assistant ----------
// Scripted, so reviews are repeatable. It maps free text onto the form, interviews for what is missing,
// and brainstorms. The spec rules it follows: one reply per turn, a turn cap, a scope gate, skip is
// never gated, and a failure hands everything captured so far to the form.
const LABEL = { title: 'Title', problem: 'Problem', solutions: 'Proposed solutions', rationale: 'Impact rationale', impact: 'Business impact', priority: 'Priority', type: 'Idea type', tags: 'Tags', description: 'Summary', 'custom.hours': 'Hours saved per week', 'custom.area': 'Affected area', 'custom.owner': 'Process owner', 'custom.safety': 'Needs safety review' };
const BRAIN = [
  [/part|stock|van/, ['Sync van stock to the parts system every night', 'Let techs reserve parts from the job before they drive out', 'Restock the 20 most-used parts automatically']],
  [/diagnos|fault|alarm|error code/, ['Attach the machine’s fault log to every service ticket', 'Give techs a guided diagnostic checklist per model', 'Alert the customer when the same fault repeats']],
  [/handoff|hand-off|manual|email|chase/, ['Replace the email handoff with one shared job record', 'Give each job one owner from intake to close', 'Notify the next team automatically when a step finishes']],
  [/report|weekly|spreadsheet|excel/, ['Generate the weekly summary straight from the service log', 'Replace the Friday email with a live dashboard', 'Report exceptions only, not the full list']],
  [/safe|injur|guard|near.?miss/, ['Add an interlock check to the start-of-shift routine', 'Run a ten-minute safety walk per cell each week', 'Log near-misses from a phone on the floor']],
];
const DEFAULT_BRAIN = ['Pilot the change with one team for two weeks', 'Write down how it works today before changing it', 'Ask the people doing the work what they would change first'];
const OFFTOPIC = /\b(weather|joke|recipe|football|movie|stock price|poem|horoscope)\b/i;
const MAX_TURNS = 10;
const chat = { msgs: null, turns: 0, offTopic: 0, step: 'problem', pending: null, closed: false, text: '' };

function openCreateIdea() {
  const off = S.ai === 'off';
  drawer.innerHTML = shell(`New idea${S.screen === 'board' ? ' · ' + esc(S.board) : ''}`, 'Add New Idea', `<div class="split${off ? ' formonly' : ''}" id="split">
    <section class="chat" aria-label="Idea assistant">
      <div class="chathd"><span class="spark" aria-hidden="true">✦</span>Idea assistant<span class="sp"></span><button class="linkbtn" data-act="manual">Fill out manually</button></div>
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <div class="compose"><form id="composer"><label class="vh" for="c-text">Message the assistant</label><textarea id="c-text" rows="2" placeholder="Describe the problem or idea. Rough notes are fine."></textarea><button class="btn pri" aria-label="Send">${svg('send')}</button></form>
        <div class="meta"><span id="c-turns"></span><button type="button" class="linkbtn" data-act="manual" style="font-weight:500">Skip the assistant and fill out the form</button></div></div>
    </section>
    <section class="formpane" aria-label="Idea form"><form id="dform" class="dbody" novalidate>
      ${off ? '<div class="notice" role="status">' + svg('info') + '<span>AI assist is unavailable, so fill in the idea here. Everything works the same.</span></div>' : '<div id="handoff"></div>'}
      ${ideaFormFields('create')}</form></section></div>`,
    `<button class="btn pri" data-act="save-idea">Create idea</button><button class="btn" data-act="close">Cancel</button>${off ? '' : '<span class="sp"></span><button class="linkbtn" data-act="assistant" id="back-to-ai" hidden>Use the assistant</button>'}`);
  drawer.classList.add('open'); if (!off) drawer.classList.add('wide');
  wireIdeaForm(null);
  if (off) { focusHeading(); return; }
  Object.assign(chat, { msgs: drawer.querySelector('#msgs'), turns: 0, offTopic: 0, step: 'problem', pending: null, closed: false });
  bot(`Hi ${ROLES[S.role][0].split(' ')[0]}. Tell me about the problem you’d like to solve, or the idea you have. I’ll fill in the form on the right as we go and ask about anything missing.`,
    [['Techs lose ~4 hours a week chasing parts because the van stock list is out of date', 'say'], ['Weekly reporting is copied by hand into a spreadsheet every Friday', 'say'], ['Near-misses on cell 3 aren’t being logged', 'say']]);
  turnsLabel();

}
function turnsLabel() { const t = drawer.querySelector('#c-turns'); if (t) t.textContent = `${MAX_TURNS - chat.turns} replies left`; }
function bubble(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; chat.msgs.append(d); chat.msgs.scrollTop = chat.msgs.scrollHeight; return d; }
function bot(text, chips = [], filled = []) {
  const d = bubble('bot', esc(text) + (filled.length ? `<span class="filled">✦ Filled in: ${filled.map((k) => LABEL[k] ?? k).join(', ')}</span>` : ''));
  if (chips.length) { const c = document.createElement('div'); c.className = 'chips'; c.innerHTML = chips.map(([label, kind, val]) => `<button type="button" data-chip="${kind}" data-val="${esc(val ?? label)}"${kind === 'sol' ? ' aria-pressed="false"' : ''}>${esc(label)}</button>`).join(''); d.append(c); }
  return d;
}
function toFormMode(reason) {
  drawer.querySelector('#split')?.classList.add('formonly'); drawer.classList.remove('wide'); chat.cancel?.();
  const back = drawer.querySelector('#back-to-ai'); if (back) back.hidden = reason === 'failed';
  if (reason === 'failed') drawer.querySelector('#handoff').innerHTML = `<div class="notice" role="status">${svg('info')}<span>AI assist is unavailable right now. Everything captured so far is filled in; finish the idea here.</span></div>`;
  drawer.querySelector('#f-title')?.focus();
}
function toChatMode() { drawer.querySelector('#split')?.classList.remove('formonly'); drawer.classList.add('wide'); drawer.querySelector('#back-to-ai').hidden = true; drawer.querySelector('#c-text')?.focus(); }

function send(text) {
  text = text.trim(); if (!text || chat.pending || chat.closed) return;
  const me = bubble('me', esc(text));
  if (OFFTOPIC.test(text)) {
    chat.offTopic++;
    setTimeout(() => me.classList.add('dropped'), 50); setTimeout(() => me.remove(), 1600);
    if (chat.offTopic >= 3) { chat.closed = true; bot('Let’s keep this to ideas for Acme Robotics. The form is still here for you.', [['Fill out the form', 'manual']]); }
    else bot('I can only help with ideas for Acme Robotics. What’s the problem you’d like to solve?');
    return;
  }
  chat.offTopic = 0; chat.turns++; turnsLabel();
  const think = bubble('bot', '<span class="thinking" aria-label="Thinking"><i></i><i></i><i></i></span> <button type="button" class="linkbtn" data-act="stop" style="margin-left:6px">Stop</button>');
  let done = false;
  chat.cancel = () => { if (done) return; done = true; clearTimeout(timer); think.remove(); chat.pending = null; };
  chat.pending = true;
  const timer = setTimeout(() => {
    done = true; think.remove(); chat.pending = null;
    // A failed turn still keeps what was typed: it is mapped onto the form before the hand-off, so
    // nothing the person said is lost when the conversation moves to the form.
    if (S.ai === 'fail') { S.ai = 'ok'; controls(); extract(text); bot('I’m not able to respond right now. Everything you’ve told me is in the form, so let’s finish there.'); setTimeout(() => toFormMode('failed'), 900); return; }
    const { filled, kept } = extract(text);
    ask(filled, kept);
  }, 650);
}

function extract(text) {
  const D = S.form, low = text.toLowerCase(), filled = [], kept = [];
  const same = (k, v) => JSON.stringify(k.startsWith('custom.') ? D.custom[k.slice(7)] : D[k]) === JSON.stringify(v);
  const put = (k, v) => { if (v === undefined || v === '' || (Array.isArray(v) && !v.length) || same(k, v)) return; (D.suggest(k, v) === 'filled' ? filled : kept).push(k); };

  // 1. Whatever the step, pick up everything the text says.
  if (!D.title) put('title', cap(text.split(/\bbecause\b|[.;!?—]|,\s/i)[0].trim()).slice(0, 80));
  if (step === 'problem' && !D.problem) put('problem', cap(text.replace(/\s+/g, ' ')).replace(/([^.!?])$/, '$1.'));
  const hrs = low.match(/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?|h)\b/); if (hrs && D.type !== 'Process Revision') { put('custom.hours', hrs[1]); }
  const area = /van|field|site|customer|tech/.test(low) ? 'Field service' : /assembly|line|cell/.test(low) ? 'Assembly' : /warehouse|shelf|pallet/.test(low) ? 'Warehouse' : null;
  if (area && !D.custom.area) put('custom.area', area);

  const tags = TAG_WORDS.filter(([re]) => re.test(low)).map(([, t]) => t); if (tags.length) put('tags', [...new Set([...D.tags, ...tags])].slice(0, 10));
  // 2. The answer to the question that was asked.
  if (step === 'solutions') put('solutions', [...D.solutions.filter((s) => s.trim()), cap(text)]);
  if (step === 'rationale') put('rationale', cap(text));
  if (step === 'custom.owner') put('custom.owner', cap(text));

  if (D.problem && D.solutions.some((s) => s.trim()) && !D.owned.has('description')) put('description', `${D.problem} Proposed: ${D.solutions.filter((s) => s.trim()).join('; ')}`);

}

function ask(filled = [], kept = []) {
  const D = S.form, m = D.missing();
  const keptNote = kept.length ? ` I kept your edit to ${kept.map((k) => LABEL[k] ?? k).join(', ')}.` : '';
  if (chat.turns >= MAX_TURNS && m.length) { chat.closed = true; bot(`That’s the most I can help with in one conversation.${keptNote} The rest is quicker in the form.`, [['Continue in the form', 'manual']], filled); return; }
  const next = m.find((k) => k !== 'title') ?? (m.includes('title') ? 'title' : null);
  chat.step = next ?? 'done';
  const src = (D.problem + ' ' + D.title).toLowerCase();
  const brain = (BRAIN.find(([re]) => re.test(src))?.[1] ?? DEFAULT_BRAIN).filter((s) => !D.solutions.includes(s));
  const hours = D.custom.hours;
  const Q = {
    problem: [`What’s going wrong, and who does it affect?${keptNote}`, []],
    title: ['What should we call this idea? A short title works best.', []],
    solutions: [`Got the problem.${keptNote} How might we fix it? Here are a few directions to start from; pick any that fit, or describe your own.`, [...brain.map((s) => [s, 'sol']), ['Sharpen the problem first', 'sharpen']]],
    rationale: [`Why does this matter to the business?${keptNote} A number makes it easier to prioritise.`, [[`Saves about ${hours || 4} hours per person each week`, 'say'], ['Cuts repeat visits for the same fault by a third', 'say'], ['Removes one manual handoff from every job', 'say']]],
    impact: [`How big is the business impact?${keptNote}`, IMPACTS.map((x) => [x, 'say'])],
    type: [`Which kind of idea is this?${keptNote}`, [['Continuous Improvement: make something we do better', 'say', 'Continuous Improvement'], ['Process Revision: change how a process works', 'say', 'Process Revision']]],
    'custom.hours': [`Roughly how many hours a week would this save?${keptNote}`, [['2', 'say'], ['4', 'say'], ['8', 'say']]],
    'custom.owner': [`Who owns the process being changed?${keptNote}`, PEOPLE.slice(0, 3).map((p) => [p, 'say'])],
  };
  if (!next) { bot(`That covers everything the form needs.${keptNote} Review it on the right, change anything you like, then create the idea.`, [['Review and create', 'review'], ['Make the rationale measurable', 'measure'], ['Add another solution', 'more']], filled); return; }
  const [q, chips] = Q[next] ?? [`Could you tell me the ${LABEL[next] ?? next}?`, []];
  bot(q, chips, filled);

function chip(btn) {
  const kind = btn.dataset.chip, val = btn.dataset.val, D = S.form;
  if (kind === 'say') { send(val); return; }
  if (kind === 'manual') { toFormMode('manual'); return; }
  if (kind === 'sol') {
    const on = btn.getAttribute('aria-pressed') !== 'true'; btn.setAttribute('aria-pressed', on);
    const list = D.solutions.filter((s) => s.trim() && s !== val); if (on) list.push(val);
    D.owned.delete('solutions'); D.suggest('solutions', list);
    if (!btn.parentElement.querySelector('[data-chip="next"]')) { const n = document.createElement('button'); n.type = 'button'; n.dataset.chip = 'next'; n.textContent = 'Done with solutions'; btn.parentElement.append(n); }
    return;
  }
  if (kind === 'next') { btn.disabled = true; if (!D.solutions.some((s) => s.trim())) { bot('Pick at least one direction, or describe your own.'); return; }
    if (!D.owned.has('description')) D.suggest('description', `${D.problem} Proposed: ${D.solutions.filter((s) => s.trim()).join('; ')}`); ask(['solutions']); return; }
  if (kind === 'sharpen') {
    const who = D.custom.area ? `For ${D.custom.area.toLowerCase()}` : 'For the people doing the work';
    const sharp = `${who}, ${D.problem.charAt(0).toLowerCase() + D.problem.slice(1)}${D.custom.hours ? ` It costs roughly ${D.custom.hours} hours a week.` : ''}`.replace(/\.\s*\./, '.');
    bot('Here’s a sharper version of the problem. Use it if it reads better.', [[sharp, 'problem']]); return; }
  if (kind === 'problem') { D.owned.delete('problem'); D.suggest('problem', val); ask(['problem']); return; }
  if (kind === 'measure') { bot('A few measurable versions:', [[`Saves about ${D.custom.hours || 4} hours per person each week (≈${(D.custom.hours || 4) * 46} hours a year)`, 'rat'], ['Halves the time from fault report to fix on site', 'rat']]); return; }
  if (kind === 'rat') { D.owned.delete('rationale'); D.suggest('rationale', val); bot('Updated the rationale.', [], ['rationale']); return; }
  if (kind === 'more') { chat.step = 'solutions'; bot('What other solution should we list?'); drawer.querySelector('#c-text').focus(); return; }
  if (kind === 'review') { const m = D.missing(); D.showErrors(m); if (!m.length) drawer.querySelector('[data-act="save-idea"]').focus(); }
}

// ---------- confirm dialog + toast ----------
const modal = document.getElementById('modal');

let tt; function toast(t) { document.querySelector('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.role = 'status'; d.textContent = t; document.body.append(d); clearTimeout(tt); tt = setTimeout(() => d.remove(), 2200); }

// ---------- multiselect with typeahead ----------
function openMs(btn) {
  closeMs();
  const key = S.screen, d = DEFS[key], f = d.filters.find((x) => x.key === btn.dataset.ms), st = listState(key);
  const opts = typeof f.options === 'function' ? f.options() : f.options;

    const inp = pop.querySelector('input'); inp.oninput = () => { draw(inp.value); pop.querySelector('input').focus(); pop.querySelector('input').setSelectionRange(99, 99); };
    pop.querySelectorAll('input[type=checkbox]').forEach((c) => (c.onchange = () => { c.checked ? st.sel[f.key].add(c.value) : st.sel[f.key].delete(c.value); st.page = 1; refreshKeepPop(btn.dataset.ms, inp.value); }));

// ---------- events ----------
document.addEventListener('click', (e) => {
  if (e.target.closest('.proto')) return;
  const t = e.target.closest('button, [data-view]'); if (!t) { if (!e.target.closest('.pop')) closeMs(); return; }
  if (!t.closest('.pop') && !t.dataset.ms) closeMs();
  if (t.closest('#dform') && !t.dataset.act) return;
  if (t.dataset.chip) { chip(t); return; }
  const key = S.screen;
  if (t.dataset.go) { S.screen = t.dataset.go; closeDrawer(); render(); return; }
  if (t.dataset.openBoard) { S.board = t.dataset.openBoard; S.screen = 'board'; closeDrawer(); render(); return; }

  if (t.dataset.viewmode) { listState(key).view = t.dataset.viewmode; render(); return; }

  if (t.dataset.page) { listState(key).page = +t.dataset.page; render(); return; }
  if (t.dataset.view) { openDrawer('view', t.dataset.view, t); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === 'close') closeDrawer();
  else if (act === 'create') { if (t.getAttribute('aria-disabled') !== 'true') openDrawer('create', null, t); }
  else if (act === 'view') { t.dataset.id ? openDrawer('view', t.dataset.id) : closeDrawer(); }
  else if (act === 'edit') openDrawer('edit', t.dataset.id, S.drawer ? S.returnFocus : t);
  else if (act === 'save-idea') saveIdea(t.dataset.id);
  else if (act === 'save-board') saveBoard(t.dataset.id);
  else if (act === 'manual') toFormMode('manual');
  else if (act === 'assistant') toChatMode();
  else if (act === 'stop') chat.cancel?.();
  else if (act === 'delete' || act === 'archive') confirmAction(act, t.dataset.id);
});
document.addEventListener('submit', (e) => { if (e.target.id === 'composer') { e.preventDefault(); const ta = drawer.querySelector('#c-text'); send(ta.value); ta.value = ''; } else e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'c-text' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.key === 'Escape') { if (document.querySelector('.pop')) closeMs(); else if (!modal.innerHTML) closeDrawer(); }
});
document.addEventListener('input', (e) => { if (e.target.id?.startsWith('q-')) { const st = listState(S.screen); st.q = e.target.value; st.page = 1; S.refocus = 'q'; render(); } });
document.addEventListener('change', (e) => { if (e.target.id?.startsWith('size-')) { const st = listState(S.screen); st.size = +e.target.value; st.page = 1; render(); } });

// ---------- prototype controls ----------
const ps = document.getElementById('p-screens'), pr = document.getElementById('p-roles'), pt = document.getElementById('theme'), pa = document.getElementById('p-ai');
// The theme is a per-user preference in the product; here it lives in this browser only.
function setTheme(k) { document.documentElement.dataset.protoTheme = k; pt.value = k; try { localStorage.setItem('collega-theme', k); } catch {} }
let saved = 'terrazzo'; try { saved = localStorage.getItem('collega-theme') || 'terrazzo'; } catch {}
setTheme(THEMES.some(([k]) => k === saved) ? saved : 'terrazzo');
pt.onchange = () => setTheme(pt.value);
pa.onchange = () => { S.ai = pa.value; };
function controls() {
  ps.innerHTML = [['boards', 'Boards'], ['board', 'Board: Opportunities'], ['ideas', 'Ideas']].map(([k, l]) => `<button data-proto-screen="${k}" aria-pressed="${S.screen === k}">${l}</button>`).join('');
  pr.innerHTML = Object.entries(ROLES).map(([k, [, l]]) => `<button data-proto-role="${k}" aria-pressed="${S.role === k}">${l}</button>`).join('');
  pa.value = S.ai;
}
document.querySelector('.proto').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.protoScreen) { S.screen = b.dataset.protoScreen; if (S.screen === 'board') S.board = 'Opportunities'; }
  if (b.dataset.protoRole) S.role = b.dataset.protoRole;
  if (b.dataset.protoScreen || b.dataset.protoRole) { closeDrawer(); render(); }
});
render();
})();
</script>
