<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1024" viewBox="0 0 1680 1024" role="img" aria-labelledby="title desc">
  <title id="title">SargentNexus compact card and detail overlay mockup</title>
  <desc id="desc">Compact swimlane card with title click opening an in-context detail overlay supporting full idea editing.</desc>

  <rect width="1680" height="1024" fill="#e9edf4"/>
  <rect x="24" y="24" width="1632" height="976" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="56" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Idea Card + Detail Overlay</text>
  <text x="56" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Board card stays compact. Title click opens overlay for full editing without navigation.</text>

  <rect x="56" y="130" width="500" height="820" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="80" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">In Review</text>

  <rect x="80" y="188" width="452" height="132" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="98" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Title (click): Standardize vendor intake</text>
  <text x="98" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Priority: High</text>
  <text x="98" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Assigned To: Jamie Flores</text>
  <text x="98" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Upvote: ^ 11</text>

  <rect x="596" y="130" width="1028" height="820" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="624" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Detail Overlay (opened from card title)</text>

  <rect x="624" y="188" width="972" height="90" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="648" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">In-context editing</text>
  <text x="648" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a">No page navigation required. Save and return directly to the board context.</text>

  <text x="624" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Title</text>
  <rect x="624" y="334" width="620" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="642" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Standardize vendor intake</text>

  <text x="1266" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Priority</text>
  <rect x="1266" y="334" width="160" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1284" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">High</text>

  <text x="1448" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Due Date (optional)</text>
  <rect x="1448" y="334" width="148" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1466" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">2026-09-15</text>

  <text x="624" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Description</text>
  <rect x="624" y="416" width="972" height="108" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="642" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Create one intake template with triage rules and assignment guidance.</text>

  <text x="624" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Assigned To</text>
  <rect x="624" y="564" width="300" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="642" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#111827">Jamie Flores</text>

  <text x="946" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Tags</text>
  <rect x="946" y="564" width="320" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="964" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">routing, supplier-risk</text>

  <text x="1288" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Mentions</text>
  <rect x="1288" y="564" width="308" height="42" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1306" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">@jamie.flores@northwind.com</text>

  <text x="624" y="636" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Comments</text>
  <rect x="624" y="650" width="972" height="196" rx="8" fill="#f8fafc" stroke="#d0d7de"/>
  <text x="642" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Jamie Flores: We should include supplier class in the intake form.</text>
  <text x="642" y="700" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a">Chris Singh: Agreed, and set default priority for urgent purchase paths.</text>

  <rect x="624" y="872" width="130" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="689" y="901" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Cancel</text>
  <rect x="770" y="872" width="190" height="46" rx="8" fill="#0f6cbd"/>
  <text x="865" y="901" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Save Idea</text>
  <rect x="976" y="872" width="194" height="46" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1073" y="901" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Move in Board</text>
</svg>
