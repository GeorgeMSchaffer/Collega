services:
  postgres:
    image: postgres:16
    container_name: collega-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Collega
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

# The database is the only service here. The API and the web app run on the host
# under `pnpm start`, against `COLLEGA_DATABASE_URL` pointing at this container.
volumes:
  postgres-data:
