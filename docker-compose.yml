services:
  postgres:
    image: postgres:16
    container_name: collega-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: Collega
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Placeholder — src/Collega.API/Dockerfile.dev does not exist yet. Not started by
  # `docker compose up` (no default profile membership); add the real Dockerfile.dev
  # before enabling the `full` profile.
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/Collega.API/Dockerfile.dev
    container_name: collega-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=Collega;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      SiteAdmin__Email: ${SITE_ADMIN_EMAIL}
      SiteAdmin__Password: ${SITE_ADMIN_PASSWORD}
    ports:
      - "5027:8080"
    volumes:
      - ./src/Collega.API:/app
    command: ["dotnet", "watch", "run", "--no-launch-profile"]

  # Placeholder — src/Collega.Client/Dockerfile.dev does not exist yet. Not started by
  # `docker compose up` (no default profile membership); add the real Dockerfile.dev
  # before enabling the `full` profile.
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: src/Collega.Client/Dockerfile.dev
    container_name: collega-web
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5173:8080"
    volumes:
      - ./src/Collega.Client:/app
    command: ["dotnet", "watch", "run", "--no-launch-profile"]

volumes:
  postgres-data:
